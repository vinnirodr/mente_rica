<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>O MindRich mudou de endereço</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #1a1a2e;
        color: #f5f5f7;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        border-radius: 18px;
        background: #d4af37;
        color: #1a1a2e;
        font-size: 2.25rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        color: #a0a0b0;
        font-size: 0.95rem;
      }
      a.cta {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.85rem 1.75rem;
        border-radius: 1rem;
        background: #d4af37;
        color: #1a1a2e;
        font-weight: 600;
        text-decoration: none;
      }
      .note {
        margin-top: 1.75rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.8rem;
        color: #71717f;
      }
    </style>
    <script>
      // O endereço novo vive num só lugar: troque aqui se o domínio mudar.
      var NEW_URL = "https://mente-rica-chi.vercel.app/";

      // Um service worker remanescente continuaria servindo o app antigo a
      // partir do cache e anularia este aviso. Limpa antes de qualquer coisa.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (rs) {
            rs.forEach(function (r) {
              r.unregister();
            });
          })
          .catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches
          .keys()
          .then(function (keys) {
            keys.forEach(function (k) {
              caches.delete(k);
            });
          })
          .catch(function () {});
      }
    </script>
  </head>
  <body>
    <main>
      <div class="mark">M</div>
      <h1>O MindRich mudou de endereço</h1>
      <p>
        O aplicativo saiu deste endereço e agora roda em um servidor próprio, com
        uma versão mais nova.
      </p>
      <p id="link-wrap">
        <a class="cta" id="cta" href="https://mente-rica-chi.vercel.app/">Ir para o MindRich</a>
      </p>
      <p class="note">
        Seu progresso ficava salvo apenas neste navegador e <strong>não vai junto</strong>
        para o novo endereço — o app recomeça do zero por lá.
      </p>
    </main>
    <script>
      document.getElementById("cta").href = NEW_URL;
    </script>
  </body>
</html>
