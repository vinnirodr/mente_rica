name: Publicar redirecionamento no GitHub Pages

# O app migrou para a Vercel. Este workflow publica no endereço antigo apenas um
# aviso de mudança, para que uma versão velha do app não continue viva num link
# que já pode ter sido compartilhado.
#
# Rode manualmente (Actions → este workflow → Run workflow) depois que o deploy
# na Vercel estiver no ar, informando a URL nova.

on:
  workflow_dispatch:
    inputs:
      new_url:
        description: "URL do app na Vercel (ex.: https://mente-rica-chi.vercel.app/)"
        required: true
        default: "https://mente-rica-chi.vercel.app/"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site de redirecionamento
        env:
          NEW_URL: ${{ inputs.new_url }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp gh-pages-redirect/index.html dist/index.html

          # Injeta a URL informada no lugar do valor padrão.
          python3 - "$NEW_URL" <<'PY'
          import re, sys, pathlib
          url = sys.argv[1]
          p = pathlib.Path("dist/index.html")
          html = p.read_text(encoding="utf-8")
          html = re.sub(r'var NEW_URL = "[^"]*";', f'var NEW_URL = "{url}";', html)
          html = html.replace('href="https://mente-rica-chi.vercel.app/"', f'href="{url}"')
          p.write_text(html, encoding="utf-8")
          PY

          # O Pages serve 404.html para qualquer caminho desconhecido, então a
          # cópia cobre os links profundos do app antigo (/dashboard, /journal…).
          cp dist/index.html dist/404.html

          grep -o 'var NEW_URL = "[^"]*"' dist/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
